<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#101B2E"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E8F1FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#078930"/>
      <stop offset="0.5" stop-color="#FCDD09"/>
      <stop offset="1" stop-color="#DA121A"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.45"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#FCDD09" stop-opacity="0.22"/><stop offset="1" stop-color="#FCDD09" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-25px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes shine{0%{transform:translateX(-420px)}100%{transform:translateX(1500px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .a{animation:driftA 11s ease-in-out infinite}
    .b{animation:driftB 14s ease-in-out infinite}
    .c{animation:driftC 17s ease-in-out infinite}
    .eyebrow{animation:rise .9s .1s both}
    .name{animation:rise 1s .3s both}
    .role{animation:rise 1s .6s both}
    .line{transform-origin:70px 0;animation:grow 1.2s .9s both}
    .chips{animation:rise 1s 1.1s both}
    .dot{animation:pulse 2s ease-in-out infinite}
    .sheen{animation:shine 7s 2s ease-in-out infinite}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="a" cx="230" cy="70" r="260" fill="url(#orbA)"/>
    <circle class="b" cx="980" cy="260" r="300" fill="url(#orbB)"/>
    <circle class="c" cx="700" cy="40" r="180" fill="url(#orbC)"/>
    <rect class="sheen" x="0" y="0" width="140" height="320" fill="#ffffff" opacity="0.035" transform="skewX(-20)"/>

    <circle class="dot" cx="72" cy="78" r="5" fill="#34D399"/>
    <text class="t eyebrow" x="90" y="83" font-size="15" letter-spacing="4" fill="#94A3B8" font-weight="600">AVAILABLE FOR OPPORTUNITIES</text>

    <text class="t name" x="70" y="170" font-size="82" font-weight="800" fill="url(#name)" letter-spacing="-2">Mesay Lemma</text>
    <rect class="line" x="70" y="192" width="170" height="4" rx="2" fill="url(#flag)"/>
    <text class="t role" x="70" y="238" font-size="26" fill="#CBD5E1" font-weight="500">Software Engineer  ·  Building products people rely on</text>

    <g class="chips t" font-size="15" font-weight="600">
      <rect x="70" y="260" width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="175" y="282" text-anchor="middle" fill="#E2E8F0">Real-world applications</text>
      <rect x="294" y="260" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="389" y="282" text-anchor="middle" fill="#E2E8F0">25K+ DAU</text>
      <rect x="498" y="260" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="608" y="282" text-anchor="middle" fill="#E2E8F0">Addis Ababa, Ethiopia</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
